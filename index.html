<style>
:root{--green:#5cb85c;--green-dark:#4cae4c;--red:#c0392b;--red-dark:#a93226;--bg:#eef1f5;--text:#333;--muted:#777;--blue:#1a73e8;--navy:#2c3e7a}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins','Segoe UI',Arial,sans-serif}
body{background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:14px;background:#fff;padding:8px 20px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
header img{height:54px}
header h1{font-size:17px;color:var(--green);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hamburger{font-size:20px;color:#666;cursor:pointer;background:none;border:none}
.bell{position:relative;font-size:20px;cursor:pointer;color:#555;margin-right:6px}
.bell i{display:block}
.bell span{position:absolute;top:-7px;right:-9px;background:#e53935;color:#fff;font-size:10px;font-weight:600;border-radius:50%;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}
.user{color:var(--green);font-size:14px;cursor:pointer;position:relative}
.dd{position:absolute;right:0;top:26px;background:#fff;border:1px solid #ddd;border-radius:4px;min-width:130px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.dd div{padding:9px 14px;color:#444;font-size:13px}.dd div:hover{background:#f2f2f2}
.layout{display:flex;min-height:calc(100vh - 65px)}
nav{width:190px;background:var(--green);color:#fff;flex-shrink:0;transition:margin .2s}
nav.closed{margin-left:-190px}
nav ul{list-style:none}
nav li{padding:11px 16px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.12)}
nav li:hover{background:var(--green-dark)}
nav li.active{background:var(--red)}
nav .sub li{background:var(--red);padding-left:26px}
nav .sub li:hover{background:var(--red-dark)}
nav .sub li.active{background:var(--red-dark)}
nav footer{font-size:10px;padding:14px 12px;color:rgba(255,255,255,.75)}
main{flex:1;padding:22px;min-width:0}
.tabs{display:flex;gap:40px;margin-bottom:18px;font-size:14px}
.tabs a,.link{color:var(--green);font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 340px;gap:20px}
.card{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:22px;margin-bottom:20px}
.welcome{display:flex;justify-content:space-between;align-items:center}
.welcome h2{color:var(--green);font-size:24px;margin-bottom:10px}
.welcome p{font-size:13px;color:var(--muted);max-width:420px}
.fee{background:var(--blue);color:#fff;text-align:center;padding:40px 20px;border-radius:6px;margin-bottom:20px;cursor:pointer}
.fee h3{font-size:20px;margin:8px 0 4px}
.semester{background:var(--navy);color:#fff;padding:22px;border-radius:6px}
.semester h4{font-size:13px;letter-spacing:1px;margin-bottom:10px}
.semester p{font-size:13px;margin-bottom:14px}
.progress{background:#fff;border-radius:10px;height:14px;overflow:hidden}
.progress div{background:var(--blue);height:100%;width:48%;color:#fff;font-size:10px;text-align:center;line-height:14px}
.section-title{display:flex;justify-content:space-between;color:var(--green);font-weight:600;margin:6px 0 12px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px;color:#555;border-bottom:1px solid #eee}
td{padding:10px;border-bottom:1px solid #f0f0f0}
.empty{text-align:center;padding:40px 0;color:var(--muted)}
.empty b{display:block;margin:10px 0 6px;color:#444}
.page-title{color:var(--green);font-size:22px;font-weight:600;margin-bottom:18px}
.profile{display:grid;grid-template-columns:280px 1fr;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.profile-left{padding:26px;border-right:1px solid #eee}
.avatar{width:70px;height:70px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 12px}
.profile-left h3{text-align:center;font-size:15px;margin-bottom:22px}
.ptabs button{display:block;width:100%;text-align:left;padding:11px 14px;border:none;font-size:13px;cursor:pointer;margin-bottom:4px;background:#999;color:#fff}
.ptabs button.active{background:var(--green)}
.profile-right{padding:26px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.field label{display:block;font-size:12px;color:#555;margin-bottom:5px}
.field input,.field select{width:100%;padding:8px;border:1px solid #ccc;border-radius:3px;font-size:13px;background:#fff}
.field input[readonly]{background:#e9ecef}
.btn{background:var(--green);color:#fff;border:none;padding:8px 20px;font-size:13px;border-radius:3px;cursor:pointer}
.btn:hover{background:var(--green-dark)}.btn.done{background:#999;cursor:default}
details{padding:12px 16px;border-bottom:1px solid #eee;font-size:13px}summary{cursor:pointer;font-weight:600;color:#444}details p{margin-top:8px;color:var(--muted)}
.note{font-size:11px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
@media(max-width:900px){.grid,.profile,.form-grid{grid-template-columns:1fr}nav{position:fixed;top:65px;bottom:0;z-index:9}nav.closed{margin-left:-190px}header h1{font-size:13px}}

/* look + motion */
nav li{border-bottom:none;justify-content:flex-start;gap:10px;font-size:13px;transition:background .2s,padding-left .2s}
nav li:hover{padding-left:20px}
nav li i{width:16px;text-align:center}
nav li i.ch{margin-left:auto;font-size:9px;width:auto}
nav li i.ch.o{transform:rotate(90deg)}
nav li.active{background:var(--red);box-shadow:inset 3px 0 0 #7b1d14}
nav .sub{animation:fadeUp .25s ease}
nav .sub li{background:rgba(0,0,0,.13);padding-left:40px}
nav .sub li.active{background:var(--red)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
.fade,.pfade{animation:fadeUp .35s ease}
.progress div{animation:grow 1.2s ease}
.fee,.semester,.card{transition:transform .2s,box-shadow .2s}
.fee:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.btn{transition:background .2s,transform .1s}.btn:active{transform:scale(.96)}
.ptabs button{transition:background .25s}
.field input,.field select{transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(92,184,92,.2)}
.avatar{background:none;color:#bbb;font-size:60px;position:relative;width:90px;height:90px}
.avatar .up{position:absolute;right:-4px;bottom:10px;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid #ccc;font-size:10px;color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer}
.profile-left{border-right:2px solid #333}
.stmt{position:relative;overflow:hidden;padding:26px 30px}
.stmt .hd{text-align:center;border-bottom:1px solid #ccc;padding-bottom:14px;margin-bottom:4px}
.stmt .hd img{display:block;margin:0 auto 10px}
.stmt .hd h3{font-size:16px;font-weight:600;margin:8px 0 6px;letter-spacing:.3px;color:#222}
.stmt .hd p{font-size:12px;color:#444;margin:2px 0}
.stmt .hd h4{font-size:17px;font-weight:600;margin-top:12px;color:#222}
.stmt .meta{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12px;line-height:1.75;margin:18px 0 10px}
.stmt .meta b{font-weight:600}
.stmt table{border:1px solid #ddd;width:100%}
.stmt th{background:#f0f2f5;font-weight:600;color:#333;padding:8px 10px}
.stmt td{padding:8px 10px}

</style>
</head>

const menu = [["fa-table-columns","Dashboard","dashboard"],["fa-globe","Socials",,[["Clubs","generic"],["Events","generic"]]],["fa-message","Message","messages"],
  ["fa-building-columns","Admission",,[["Profile","profile"],["Reporting","reporting"],["Hostel Booking","hostel"]]],

let current = "dashboard", open = "", ptab = 0;
function renderMenu() {
  $("#menu").innerHTML = menu.map(([ic, label, v, kids], i) => {
    const isOpen = open === i, act = (v && v === current) || (kids && kids.some(k => k[1] === current));
    const head = `<li class="${act && !isOpen ? 'active' : ''}" ${kids ? `data-open="${i}"` : `data-go="${v}" data-t="${label}"`}><i class="fa-solid ${ic}"></i>${label}${kids ? `<i class="fa-solid fa-chevron-right ch ${isOpen ? 'o' : ''}"></i>` : ''}</li>`;
    const sub = kids && isOpen ? `<ul class="sub">${kids.map(k => `<li class="${k[1] === current ? 'active' : ''}" data-go="${k[1]}" data-t="${k[0]}">${k[0]}</li>`).join('')}</ul>` : '';
    return head + sub;
  }).join('');
}
function go(v, title) {
  current = v;
  const el = $("#view");
  el.innerHTML = views[v] ? views[v]() : page(title || "Coming soon", `<div class="empty"><div style="font-size:50px">&#128230;</div><b>Nothing here yet</b>This section has no items.</div>`);
  el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
  renderMenu(); window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const t = e.target;
  const g = t.closest("[data-go]"), o = t.closest("[data-open]");
  if (o) { open = open === +o.dataset.open ? "" : +o.dataset.open; renderMenu(); }
  else if (g) { go(g.dataset.go, g.dataset.t); if (innerWidth < 900) $("#nav").classList.add("closed"); }
  if (t.closest("#burger")) $("#nav").classList.toggle("closed");
  if (t.closest("#user")) $("#dd").hidden = !$("#dd").hidden; else $("#dd").hidden = true;
  if (t.closest("#logout")) alert("Signed out (demo only).");
  if (t.dataset.book !== undefined) { booked = +t.dataset.book; go("hostel"); }
  if (t.dataset.report !== undefined) alert("Reporting confirmed for Semester 1 2026/2027.");
  const pb = t.closest("[data-ptab]"); if (pb) { ptab = +pb.dataset.ptab; $("#view").innerHTML = views.profile(); }
  if (t.dataset.save !== undefined) alert("Profile updated successfully!");
});
if (innerWidth < 900) $("#nav").classList.add("closed");
go("dashboard");
